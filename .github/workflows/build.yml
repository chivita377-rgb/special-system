name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Descomprimir proyecto
        run: unzip -q MCImporter.zip
      - name: Compilar
        run: cd MCImporter && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MCImporter-apk
          path: MCImporter/app/build/outputs/apk/debug/app-debug.apk
